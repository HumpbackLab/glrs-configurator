name: Create release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - release
      version:
        description: Version, for example 0.2.0 or v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.channel }} release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_id: ${{ steps.release.outputs.release_id }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        env:
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          VERSION="${REQUESTED_VERSION#v}"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$CHANNEL" = release ]; then
            TAG="v$VERSION"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Node.js
        if: inputs.channel == 'release' && steps.meta.outputs.tag_exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Synchronize release version
        if: inputs.channel == 'release' && steps.meta.outputs.tag_exists == 'false'
        run: node scripts/set-release-version.mjs "${{ steps.meta.outputs.version }}"

      - name: Install frontend dependencies
        if: inputs.channel == 'release' && steps.meta.outputs.tag_exists == 'false'
        working-directory: app
        run: npm ci

      - name: Validate frontend build
        if: inputs.channel == 'release' && steps.meta.outputs.tag_exists == 'false'
        working-directory: app
        run: npm run build

      - name: Commit version and create tag
        if: inputs.channel == 'release' && steps.meta.outputs.tag_exists == 'false'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/package.json \
            app/package-lock.json \
            app/src-tauri/tauri.conf.json \
            app/src-tauri/Cargo.toml \
            app/src-tauri/Cargo.lock
          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "chore: release $TAG"
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin "HEAD:$BASE_BRANCH" "$TAG"

      - name: Create or reuse GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ steps.meta.outputs.version }}
          STABLE_TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          if [ "$CHANNEL" = beta ]; then
            RELEASE_TAG=beta
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Beta configurator $VERSION" \
                --prerelease \
                --target "$SOURCE_REF"
            else
              gh release create "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Beta configurator $VERSION" \
                --notes "Automated beta configurator build." \
                --prerelease \
                --target "$SOURCE_REF"
            fi
          else
            RELEASE_TAG="$STABLE_TAG"
            SOURCE_REF="$RELEASE_TAG"
            if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --title "$RELEASE_TAG" \
                --generate-notes
            fi
          fi

          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          {
            echo "release_tag=$RELEASE_TAG"
            echo "release_id=$RELEASE_ID"
            echo "source_ref=$SOURCE_REF"
          } >> "$GITHUB_OUTPUT"

  packages:
    name: Build and publish packages
    needs: prepare
    uses: ./.github/workflows/release.yml
    with:
      channel: ${{ inputs.channel }}
      version: ${{ needs.prepare.outputs.version }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      release_id: ${{ needs.prepare.outputs.release_id }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
    secrets: inherit

name: Build release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        required: true
        type: choice
        options: [beta]
      version:
        description: Version shown in the beta manifest
        required: true
        type: string
      ref:
        description: Branch or commit to build
        required: true
        default: master
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_id: ${{ steps.meta.outputs.release_id }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve release channel
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'release' }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -Eeuo pipefail
          if [ "$CHANNEL" = beta ]; then
            test -n "$INPUT_VERSION"
            RELEASE_TAG=beta
            VERSION="${INPUT_VERSION#v}"
            SOURCE_REF="${INPUT_REF:-master}"
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Beta configurator $VERSION" --prerelease --target "$SOURCE_REF"
            else
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Beta configurator $VERSION" --notes "Automated beta configurator build." --prerelease --target "$SOURCE_REF"
            fi
            RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          else
            RELEASE_TAG="$EVENT_TAG"
            VERSION="${RELEASE_TAG#v}"
            SOURCE_REF="$RELEASE_TAG"
            RELEASE_ID="$EVENT_RELEASE_ID"
          fi
          {
            echo "release_tag=$RELEASE_TAG"
            echo "release_id=$RELEASE_ID"
            echo "source_ref=$SOURCE_REF"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: github.event_name != 'release' || github.event.release.tag_name != 'beta'
    name: Build ${{ matrix.name }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            bundles: nsis
          - name: Linux
            platform: ubuntu-22.04
            bundles: deb

    runs-on: ${{ matrix.platform }}
    concurrency:
      group: release-${{ needs.prepare.outputs.release_id }}-${{ matrix.platform }}
      cancel-in-progress: false

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Set or verify application version
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            node scripts/set-release-version.mjs "${{ needs.prepare.outputs.release_tag }}" --check
          else
            node scripts/set-release-version.mjs "${{ needs.prepare.outputs.version }}"
          fi

      - name: Build and attach package to the GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.release_tag }}
          updaterJsonPreferNsis: true
          args: --bundles ${{ matrix.bundles }}

  android:
    needs: prepare
    if: github.event_name != 'release' || github.event.release.tag_name != 'beta'
    name: Build Android APK
    runs-on: ubuntu-22.04
    concurrency:
      group: release-${{ needs.prepare.outputs.release_id }}-android
      cancel-in-progress: false

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Set or verify application version
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            node scripts/set-release-version.mjs "${{ needs.prepare.outputs.release_tag }}" --check
          else
            node scripts/set-release-version.mjs "${{ needs.prepare.outputs.version }}"
          fi

      - name: Initialize Android project
        working-directory: app
        run: npm run tauri android init -- --ci

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is not configured" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gyro-elrs-configurator-release.jks"
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=gyro-elrs-configurator" \
            "storeFile=$RUNNER_TEMP/gyro-elrs-configurator-release.jks" \
            > app/src-tauri/keystore.properties
          chmod 600 "$RUNNER_TEMP/gyro-elrs-configurator-release.jks" app/src-tauri/keystore.properties

      - name: Build and attach Android APK to the GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          mobile: android
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.release_tag }}
          uploadUpdaterJson: false
          releaseAssetNamePattern: gyro-elrs-configurator_[version]_[arch].[ext]
          args: --target aarch64 --apk --split-per-abi --ci

  android-manifest:
    name: Publish Android update manifest
    needs: [prepare, build, android]
    if: github.event_name != 'release' || github.event.release.tag_name != 'beta'
    runs-on: ubuntu-latest

    steps:
      - name: Build and upload Android update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/android-update"
          gh release download "$TAG" \
            --repo "$REPOSITORY" \
            --pattern '*arm64.apk' \
            --dir "$RUNNER_TEMP/android-update"
          APK_PATH="$(find "$RUNNER_TEMP/android-update" -maxdepth 1 -type f -name '*arm64.apk' -print -quit)"
          test -n "$APK_PATH"
          APK_NAME="$(basename "$APK_PATH")"
          APK_SIZE="$(stat -c '%s' "$APK_PATH")"
          APK_SHA256="$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          APK_URL="$(gh api "repos/$REPOSITORY/releases/tags/$TAG" \
            --jq ".assets[] | select(.name == \"$APK_NAME\") | .browser_download_url")"
          RELEASE_NOTES="$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq '.body // ""')"
          VERSION="${TAG#v}"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$RELEASE_NOTES" \
            --arg url "$APK_URL" \
            --arg sha256 "$APK_SHA256" \
            --argjson size "$APK_SIZE" \
            '{
              schema: 1,
              version: $version,
              notes: $notes,
              artifact: {
                arch: "aarch64",
                url: $url,
                size: $size,
                sha256: $sha256
              }
            }' > "$RUNNER_TEMP/android-update/android-latest.json"
          gh release upload "$TAG" \
            --repo "$REPOSITORY" \
            --clobber \
            "$RUNNER_TEMP/android-update/android-latest.json"

  sync-gitee:
    name: Sync release to Gitee
    needs: [prepare, android-manifest]
    if: github.event_name == 'release' && github.event.release.tag_name != 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out the latest release sync script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'master' }}

      - name: Sync GitHub release and updater manifest to Gitee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY || 'ncer/glrs-configurator' }}
          GITEE_MAX_ASSET_BYTES: 50000000
          REQUIRED_ASSET_SUFFIXES: .apk
          SKIP_EXISTING_ASSETS: 1
          SKIP_OVERSIZE_ASSETS: 1
        run: |
          ./scripts/sync-github-release-to-gitee.sh \
            "${{ github.repository }}" \
            "$GITEE_REPOSITORY" \
            "${{ needs.prepare.outputs.release_tag }}"

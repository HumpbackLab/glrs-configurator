[package]
name = "gyro-android-updater"
version = "0.1.0"
edition = "2021"
links = "gyro-android-updater"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
thiserror = "2"
